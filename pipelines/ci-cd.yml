trigger: none

pool: 
  vmImage: 'ubuntu-latest'

variables:
  WebAppName: ${{
    if eq(variables['Build.SourceBranchName'], 'demo-env') }} 'demo-reability'
    ${{ if eq(variables['Build.SourceBranchName'], 'us-env') }} 'us-reability'
    ${{ if eq(variables['Build.SourceBranchName'], 'app-env') }} 'app-reability'
  DockerNamespaceName: 'acrreability'

resources:
  repositories:
    - repository: Pipelines
      type: git
      name: Hohermarkt/Pipelines  # Change this to the actual repo
      ref: refs/heads/main  # Change branch if needed

stages:
- stage: BuildStage
  jobs:
  - job:
    displayName: Build frontend image
    workspace:
        clean: all
    steps:
    - template: /pipelines/CI/ci.yaml@Pipelines
      # parameters:
      #   dockerFile: Dockerfile
      #   buildContext: $(Build.SourcesDirectory)
      #   repository: spectory-reability-main

- stage: DeployStage
  jobs:
  - job:
    displayName: Deploy frontend image
    workspace:
        clean: all
    steps:
    - template: /pipelines/CD/cd.yaml@Pipelines
      parameters:
        WebAppName: $(WebAppName)
        DockerNamespaceName: $(DockerNamespaceName)
